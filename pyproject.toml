[project]
name = "trendbyte"
version = "0.1.0"
description = "Tech Trend Intelligence Twitter Bot"
requires-python = ">=3.12,<4.0"
dependencies = [
    "tweepy==4.14.0",
    "PyGithub==2.3.0",
    "praw==7.7.1",
    "psycopg[binary]==3.2.13",
    "jinja2==3.1.4",
    "playwright==1.44.0",
    "python-dotenv==1.0.1",
    "requests==2.32.3",
    "spacy==3.8.7",
    "fastapi==0.111.0",
    "uvicorn==0.30.1",
    "slowapi==0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.1",
    "pytest-cov==5.0.0",
    "black==24.4.2",
    "ruff==0.4.5",
    "mypy==1.10.0",
    "isort==5.13.2",
]

[tool.black]
line-length = 100

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # line too long (let formatter handle it)
    "B008",   # do not perform function calls in argument defaults
    "SIM108", # use ternary operator
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["src", "api"]
combine-as-imports = true

[tool.mypy]
strict = true
python_version = "3.12"

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
