[project]
name = "trendbyte"
version = "0.1.0"
description = "Tech Trend Intelligence Twitter Bot"
requires-python = ">=3.12,<4.0"
dependencies = [
    "tweepy==4.14.0",
    "PyGithub==2.3.0",
    "praw==7.7.1",
    "psycopg[binary]==3.2.13",
    "jinja2==3.1.4",
    "playwright==1.44.0",
    "python-dotenv==1.0.1",
    "requests==2.32.3",
    "fastapi==0.111.0",
    "uvicorn==0.30.1",
    "slowapi==0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.1",
    "pytest-cov==5.0.0",
    "black==24.4.2",
    "ruff==0.4.5",
    "mypy==1.10.0",
    "isort==5.13.2",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "S", "B"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
